<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GUVI Web Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center mb-4">GUVI Registration & Profile System</h2>

        <div id="alert-box"></div>

        <div class="row">
            <!-- Register Section -->
            <div class="col-md-6">
                <div class="card shadow mb-3">
                    <div class="card-body">
                        <h4>Register</h4>

                        <div class="mb-3">
                            <label>Email</label>
                            <input id="reg_email" type="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input id="reg_pass" type="password" class="form-control">
                        </div>

                        <button id="btn_register" class="btn btn-primary w-100">Register</button>
                    </div>
                </div>
            </div>

            <!-- Login Section -->
            <div class="col-md-6">
                <div class="card shadow mb-3">
                    <div class="card-body">
                    <h4>Login</h4>

                        <div class="mb-3">
                            <label>Email</label>
                            <input id="log_email" type="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input id="log_pass" type="password" class="form-control">
                        </div>

                        <button id="btn_login" class="btn btn-success w-100">Login</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Section -->
        <div class="card shadow mt-5">
            <div class="card-body">
                <h4>Profile (MongoDB)</h4>

                <div class="mb-3">
                    <label>Full Name</label>
                    <input id="pname" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Bio</label>
                    <textarea id="pbio" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label>Skills (comma separated)</label>
                    <input id="pskills" type="text" class="form-control">
                </div>

                <button id="btn_save_profile" class="btn btn-primary mt-2">Save Profile</button>
                <button id="btn_load_profile" class="btn btn-secondary mt-2">Load Profile</button>
                <button id="btn_logout" class="btn btn-danger mt-2 float-end">Logout</button>

                <pre id="profile_output" class="mt-4"></pre>
            </div>
        </div>

    </div>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
